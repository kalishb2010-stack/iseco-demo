name: Build ISECO SOS Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-iseco-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<uses-permission android:name="android.permission.INTERNET" />'
          perms='''<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'''
          s=s.replace(marker,perms)
          p.write_text(s)
          PY
      - name: Set Play target SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for fn in ['android/variables.gradle','android/app/build.gradle']:
              p=Path(fn)
              if p.exists():
                  s=p.read_text()
                  import re
                  s=re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', s)
                  s=re.sub(r'targetSdk\s+\d+', 'targetSdk 36', s)
                  s=re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', s)
                  s=re.sub(r'compileSdk\s+\d+', 'compileSdk 36', s)
                  p.write_text(s)
          PY
      - name: Build Android test APK and Play-ready unsigned bundle
        run: cd android && ./gradlew assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ISECO-SOS-Android-Test
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ISECO-SOS-Play-Unsigned-AAB
          path: mobile-app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
