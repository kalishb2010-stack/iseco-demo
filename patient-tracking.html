<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISECO • Your Ambulance is Coming</title><style>body{margin:0;font-family:system-ui;background:#f4f7fb;color:#102033}.w{max-width:720px;margin:auto;padding:20px}.hero{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 30px #0001}.green{color:#087f5b}.eta{font-size:54px;font-weight:900}.map{height:300px;border-radius:18px;background:#dce9df;position:relative;overflow:hidden;margin:16px 0}.road{position:absolute;left:-10%;top:48%;width:120%;height:14px;background:#fff;transform:rotate(-8deg)}.amb{position:absolute;left:50%;top:42%;font-size:36px;transform:translate(-50%,-50%)}.pulse{position:absolute;left:50%;top:47%;width:80px;height:80px;border:2px solid #e63946;border-radius:50%;transform:translate(-50%,-50%)}.row{display:flex;gap:12px}.card{flex:1;background:#fff;border-radius:16px;padding:16px}.small{font-size:13px;color:#667}.bad{color:#b42318}.ok{color:#087f5b}</style></head><body><div class="w"><div class="hero"><div class="small">ISECO • 1033 PRESENTATION PROXY • TEST ONLY</div><h2>Your ambulance is on the way</h2><div id="eta" class="eta">—</div><div id="status" class="green">Waiting for ambulance GPS…</div><div class="map"><div class="road"></div><div class="pulse"></div><div class="amb">🚑</div></div><div class="row"><div class="card"><div class="small">Ambulance</div><b id="amb">AMB-0001</b></div><div class="card"><div class="small">Live speed</div><b id="speed">—</b></div></div><div class="card" style="margin-top:12px"><div class="small">Last live update</div><b id="last">—</b><br><span id="gps" class="small">Secure tracking session</span></div></div></div><script>const API='https://itsyjtcqhzjbrcwdccmy.supabase.co/functions/v1/tracking-api';const TOKEN='view_5Rt8N3cL6yW2';let prev=null;function hav(a,b){const R=6371,p=Math.PI/180,d1=(b[0]-a[0])*p,d2=(b[1]-a[1])*p,x=Math.sin(d1/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(x))}async function tick(){try{const r=await fetch(API+'?mode=read&token='+encodeURIComponent(TOKEN),{cache:'no-store'}),j=await r.json();if(!j.ok)throw 0;$('amb').textContent=j.session.ambulance_id||'AMB-0001';if(!j.location){$('status').textContent='Ambulance dispatched • waiting for first GPS update';return}const l=j.location,age=Math.max(0,(Date.now()-new Date(l.recorded_at))/1000);$('last').textContent=new Date(l.recorded_at).toLocaleTimeString()+' • '+Math.round(age)+' sec ago';$('speed').textContent=l.speed==null?'GPS active':Math.round(l.speed*3.6)+' km/h';$('gps').textContent=`GPS accuracy ${l.accuracy?Math.round(l.accuracy)+' m':'—'}`;let moving=l.speed!=null&&l.speed>1.2;if(prev){const d=hav([prev.lat,prev.lon],[l.lat,l.lon]);if(d>.02)moving=true}prev=l;$('status').textContent=age>30?'GPS update delayed':(moving?'Ambulance is moving toward you':'Ambulance GPS connected');$('status').className=age>30?'bad':'green';if(j.session.destination_lat!=null&&j.session.destination_lon!=null){const km=hav([l.lat,l.lon],[j.session.destination_lat,j.session.destination_lon]);const kph=l.speed&&l.speed>2?l.speed*3.6:40;const min=Math.max(1,Math.ceil(km/kph*60));$('eta').textContent=min+' min';}else $('eta').textContent=moving?'LIVE':'GPS';}catch(e){$('status').textContent='Reconnecting to ambulance…';$('status').className='bad'}}const $=x=>document.getElementById(x);tick();setInterval(tick,3000);</script></body></html>
