name: Build ISECO SOS Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-iseco-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<uses-permission android:name="android.permission.INTERNET" />'
          perms='''<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'''
          s=s.replace(marker,perms)
          if '<queries>' not in s:
              s=s.replace('<application', '<queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n    <application')
          p.write_text(s)
          PY
      - name: Add ISECO native emergency bridge
        run: |
          cat > android/app/src/main/java/in/iseco/sos/MainActivity.java <<'JAVA'
          package in.iseco.sos;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.provider.MediaStore;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.webkit.JavascriptInterface;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import androidx.core.app.ActivityCompat;
          import com.getcapacitor.BridgeActivity;
          import org.json.JSONObject;
          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends BridgeActivity {
            private TextToSpeech tts;
            private SpeechRecognizer sr;
            private static final int REQ_PERMS=91, REQ_PHOTO=92, REQ_VIDEO=93;

            @Override public void onCreate(Bundle state){
              super.onCreate(state);
              tts=new TextToSpeech(this, status->{});
              getBridge().getWebView().addJavascriptInterface(new NativeBridge(), "ISECOAndroid");
              ActivityCompat.requestPermissions(this,new String[]{Manifest.permission.RECORD_AUDIO,Manifest.permission.CAMERA,Manifest.permission.ACCESS_FINE_LOCATION,Manifest.permission.ACCESS_COARSE_LOCATION},REQ_PERMS);
            }
            private void js(String code){ runOnUiThread(()->getBridge().getWebView().evaluateJavascript(code,null)); }
            private String q(String x){ return JSONObject.quote(x==null?"":x); }

            public class NativeBridge {
              @JavascriptInterface public void speak(String text,String lang){
                runOnUiThread(()->{
                  Locale loc=Locale.forLanguageTag(lang==null?"hi-IN":lang);
                  tts.setLanguage(loc); tts.setSpeechRate(0.88f); tts.setPitch(0.92f);
                  tts.speak(text,TextToSpeech.QUEUE_FLUSH,null,"ISECO");
                });
              }
              @JavascriptInterface public void startSpeech(String lang){
                runOnUiThread(()->{
                  if(!SpeechRecognizer.isRecognitionAvailable(MainActivity.this)){ js("window.onNativeSpeechError&&onNativeSpeechError('Speech recognition unavailable')"); return; }
                  if(sr!=null) sr.destroy();
                  sr=SpeechRecognizer.createSpeechRecognizer(MainActivity.this);
                  sr.setRecognitionListener(new RecognitionListener(){
                    public void onReadyForSpeech(Bundle b){ js("window.onNativeSpeechState&&onNativeSpeechState('LISTENING')"); }
                    public void onBeginningOfSpeech(){}
                    public void onRmsChanged(float r){}
                    public void onBufferReceived(byte[] b){}
                    public void onEndOfSpeech(){}
                    public void onError(int e){ js("window.onNativeSpeechError&&onNativeSpeechError('Speech paused — tap microphone to continue')"); }
                    public void onResults(Bundle b){ ArrayList<String> a=b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION); if(a!=null&&!a.isEmpty()) js("window.onNativeSpeech&&onNativeSpeech("+q(a.get(0))+",true)"); }
                    public void onPartialResults(Bundle b){ ArrayList<String> a=b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION); if(a!=null&&!a.isEmpty()) js("window.onNativeSpeech&&onNativeSpeech("+q(a.get(0))+",false)"); }
                    public void onEvent(int t,Bundle b){}
                  });
                  Intent i=new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL,RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE,lang==null?"hi-IN":lang);
                  i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS,true);
                  sr.startListening(i);
                });
              }
              @JavascriptInterface public void stopSpeech(){ runOnUiThread(()->{if(sr!=null)sr.stopListening();}); }
              @JavascriptInterface public String deviceInfo(){
                try{ JSONObject o=new JSONObject(); o.put("manufacturer",Build.MANUFACTURER);o.put("model",Build.MODEL);o.put("android",Build.VERSION.RELEASE);return o.toString(); }catch(Exception e){return "{}";}
              }
              @JavascriptInterface public void requestLocation(){
                runOnUiThread(()->{
                  if(ActivityCompat.checkSelfPermission(MainActivity.this,Manifest.permission.ACCESS_FINE_LOCATION)!=PackageManager.PERMISSION_GRANTED){return;}
                  LocationManager lm=(LocationManager)getSystemService(LOCATION_SERVICE);
                  LocationListener ll=new LocationListener(){ public void onLocationChanged(Location l){js("window.onNativeLocation&&onNativeLocation("+l.getLatitude()+","+l.getLongitude()+","+l.getAccuracy()+")"); try{lm.removeUpdates(this);}catch(Exception e){}} };
                  try{lm.requestLocationUpdates(LocationManager.GPS_PROVIDER,0,0,ll);}catch(Exception e){}
                  try{Location l=lm.getLastKnownLocation(LocationManager.GPS_PROVIDER);if(l!=null)ll.onLocationChanged(l);}catch(Exception e){}
                });
              }
              @JavascriptInterface public void takePhoto(){ runOnUiThread(()->startActivityForResult(new Intent(MediaStore.ACTION_IMAGE_CAPTURE),REQ_PHOTO)); }
              @JavascriptInterface public void recordVideo(){ runOnUiThread(()->startActivityForResult(new Intent(MediaStore.ACTION_VIDEO_CAPTURE),REQ_VIDEO)); }
            }
            @Override protected void onActivityResult(int requestCode,int resultCode,Intent data){
              super.onActivityResult(requestCode,resultCode,data);
              if(resultCode==Activity.RESULT_OK && requestCode==REQ_PHOTO) js("window.onNativeEvidenceCaptured&&onNativeEvidenceCaptured('photo')");
              if(resultCode==Activity.RESULT_OK && requestCode==REQ_VIDEO) js("window.onNativeEvidenceCaptured&&onNativeEvidenceCaptured('video')");
            }
            @Override public void onDestroy(){ if(sr!=null)sr.destroy();if(tts!=null)tts.shutdown();super.onDestroy(); }
          }
          JAVA
      - name: Set Play target SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for fn in ['android/variables.gradle','android/app/build.gradle']:
              p=Path(fn)
              if p.exists():
                  s=p.read_text()
                  import re
                  s=re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', s)
                  s=re.sub(r'targetSdk\s+\d+', 'targetSdk 36', s)
                  s=re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', s)
                  s=re.sub(r'compileSdk\s+\d+', 'compileSdk 36', s)
                  p.write_text(s)
          PY
      - name: Build Android test APK and Play-ready unsigned bundle
        run: cd android && ./gradlew assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ISECO-SOS-Android-Test
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ISECO-SOS-Play-Unsigned-AAB
          path: mobile-app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
