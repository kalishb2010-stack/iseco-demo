<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISECO • Live Ambulance Tracking</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:system-ui;background:#f4f7fb;color:#102033}.w{max-width:760px;margin:auto;padding:18px}.hero{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 30px #0001}.small{font-size:13px;color:#667}.green{color:#087f5b}.bad{color:#b42318}.eta{font-size:52px;font-weight:900}.sub{font-size:18px;font-weight:700;margin-bottom:12px}#map{height:360px;border-radius:18px;margin:16px 0;z-index:1}.row{display:flex;gap:10px}.card{flex:1;background:#f7f9fc;border-radius:14px;padding:14px}button{width:100%;border:0;border-radius:14px;padding:15px;font-weight:800;background:#1267e5;color:white;margin:8px 0}.ambIcon,.youIcon{font-size:30px;filter:drop-shadow(0 2px 2px #fff)}</style></head><body><div class="w"><div class="hero"><div class="small">ISECO • 1033 PRESENTATION PROXY • TEST ONLY</div><h2>Your ambulance is on the way</h2><div id="eta" class="eta">LIVE</div><div id="distance" class="sub">Set your accident location for ETA</div><div id="status" class="green">Connecting to ambulance…</div><button id="locate">USE MY LOCATION AS ACCIDENT LOCATION</button><div id="map"></div><div class="row"><div class="card"><div class="small">Ambulance</div><b id="amb">AMB-0001</b></div><div class="card"><div class="small">Live speed</div><b id="speed">—</b></div></div><div class="card" style="margin-top:10px"><b id="move">Waiting for GPS</b><br><span id="last" class="small">—</span><br><span id="gps" class="small">Secure tracking session</span></div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const API='https://itsyjtcqhzjbrcwdccmy.supabase.co/functions/v1/tracking-api',TOKEN='view_5Rt8N3cL6yW2';const $=x=>document.getElementById(x);let map=null,am=null,me=null,route=null,prev=null,dest=null,first=true;function hav(a,b){const R=6371,p=Math.PI/180,d1=(b[0]-a[0])*p,d2=(b[1]-a[1])*p,x=Math.sin(d1/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(x))}function init(lat,lon){if(map)return;map=L.map('map').setView([lat,lon],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}function icon(t){return L.divIcon({html:`<div class="${t==='🚑'?'ambIcon':'youIcon'}">${t}</div>`,className:'',iconSize:[36,36],iconAnchor:[18,18]})}function drawRoute(a,b){if(route)map.removeLayer(route);route=L.polyline([a,b],{weight:5,opacity:.7,dashArray:'8,8'}).addTo(map);map.fitBounds(route.getBounds(),{padding:[45,45],maxZoom:16})}async function saveDest(lat,lon){const r=await fetch(API+'?mode=destination',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:TOKEN,lat,lon})});const j=await r.json();if(!j.ok)throw Error();dest=[lat,lon];$('locate').textContent='ACCIDENT LOCATION SET ✓';$('locate').style.background='#087f5b'}$('locate').onclick=()=>{if(!navigator.geolocation){$('status').textContent='Location unavailable';return}navigator.geolocation.getCurrentPosition(async p=>{try{await saveDest(p.coords.latitude,p.coords.longitude);init(p.coords.latitude,p.coords.longitude);if(me)me.setLatLng(dest);else me=L.marker(dest,{icon:icon('📍')}).addTo(map).bindPopup('Accident / patient location')}catch(e){$('status').textContent='Could not save accident location'}},e=>{$('status').textContent='Please allow location permission'},{enableHighAccuracy:true,timeout:15000,maximumAge:0})};async function tick(){try{const r=await fetch(API+'?mode=read&token='+encodeURIComponent(TOKEN)+'&t='+Date.now(),{cache:'no-store'}),j=await r.json();if(!j.ok)throw 0;$('amb').textContent=j.session.ambulance_id||'AMB-0001';if(j.session.destination_lat!=null)dest=[j.session.destination_lat,j.session.destination_lon];const l=j.location;if(!l){$('status').textContent='Waiting for ambulance GPS';return}init(l.lat,l.lon);const pos=[l.lat,l.lon];if(!am)am=L.marker(pos,{icon:icon('🚑')}).addTo(map).bindPopup('Live ambulance');else am.setLatLng(pos);if(dest){if(!me)me=L.marker(dest,{icon:icon('📍')}).addTo(map).bindPopup('Accident / patient');else me.setLatLng(dest);drawRoute(pos,dest);const km=hav(pos,dest),kph=l.speed&&l.speed>2?Math.max(15,l.speed*3.6):40,min=Math.max(1,Math.ceil(km/kph*60));$('eta').textContent='~'+min+' min';$('distance').textContent=(km<1?Math.round(km*1000)+' m':km.toFixed(1)+' km')+' away • Estimated ETA';$('locate').textContent='ACCIDENT LOCATION SET ✓';$('locate').style.background='#087f5b'}else if(first){map.setView(pos,16)}let d=0;if(prev&&prev.recorded_at!==l.recorded_at)d=hav([prev.lat,prev.lon],pos);const moving=(l.speed!=null&&l.speed>1.2)||d>.008,age=(Date.now()-new Date(l.recorded_at))/1000;$('speed').textContent=l.speed==null?(moving?'Moving':'GPS active'):Math.round(l.speed*3.6)+' km/h';$('move').textContent=moving?'AMBULANCE MOVING LIVE • +'+Math.round(d*1000)+' m':'Ambulance GPS connected';$('last').textContent='Updated '+new Date(l.recorded_at).toLocaleTimeString()+' • '+Math.round(age)+' sec ago';$('gps').textContent='GPS accuracy '+(l.accuracy?Math.round(l.accuracy)+' m':'—');$('status').textContent=age>30?'GPS update delayed':moving?'Ambulance is moving toward you':'Ambulance GPS connected';$('status').className=age>30?'bad':'green';prev=l;first=false}catch(e){$('status').textContent='Reconnecting to ambulance…';$('status').className='bad'}}tick();setInterval(tick,3000);</script></body></html>
