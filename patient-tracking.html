<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISECO • Live Ambulance</title><style>body{margin:0;font-family:system-ui;background:#f4f7fb;color:#102033}.w{max-width:720px;margin:auto;padding:20px}.hero{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 30px #0001}.green{color:#087f5b}.bad{color:#b42318}.eta{font-size:54px;font-weight:900}.map{height:300px;border-radius:18px;background:linear-gradient(145deg,#dce9df,#cbded2);position:relative;overflow:hidden;margin:16px 0}.road{position:absolute;left:-15%;top:50%;width:130%;height:16px;background:#fff;transform:rotate(-8deg);box-shadow:0 0 0 1px #ccd4d0}.amb{position:absolute;left:18%;top:58%;font-size:38px;transform:translate(-50%,-50%);transition:left 2.6s linear,top 2.6s linear;z-index:3}.pulse{position:absolute;width:76px;height:76px;border:2px solid #ef3340;border-radius:50%;left:18%;top:58%;transform:translate(-50%,-50%);transition:left 2.6s linear,top 2.6s linear;z-index:2}.dest{position:absolute;right:7%;top:25%;font-size:30px}.row{display:flex;gap:12px}.card{flex:1;background:#fff;border-radius:16px;padding:16px}.small{font-size:13px;color:#667}</style></head><body><div class="w"><div class="hero"><div class="small">ISECO • 1033 PRESENTATION PROXY • TEST ONLY</div><h2>Your ambulance is on the way</h2><div id="eta" class="eta">LIVE</div><div id="status" class="green">Waiting for ambulance GPS…</div><div class="map"><div class="road"></div><div id="pulse" class="pulse"></div><div id="marker" class="amb">🚑</div><div class="dest">📍</div></div><div class="row"><div class="card"><div class="small">Ambulance</div><b id="amb">AMB-0001</b></div><div class="card"><div class="small">Live speed</div><b id="speed">—</b></div></div><div class="card" style="margin-top:12px"><div class="small">Movement</div><b id="move">Waiting for next GPS point</b><br><span id="last" class="small">—</span><br><span id="gps" class="small">Secure tracking session</span></div></div></div></div><script>const API='https://itsyjtcqhzjbrcwdccmy.supabase.co/functions/v1/tracking-api',TOKEN='view_5Rt8N3cL6yW2';let prev=null,trail=0;const $=x=>document.getElementById(x);function hav(a,b){const R=6371,p=Math.PI/180,d1=(b[0]-a[0])*p,d2=(b[1]-a[1])*p,x=Math.sin(d1/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(x))}function markerMove(distance){if(distance<.008)return;trail=Math.min(72,trail+Math.max(2,Math.min(10,distance*100)));const left=18+trail,top=58-trail*.22;$('marker').style.left=left+'%';$('marker').style.top=top+'%';$('pulse').style.left=left+'%';$('pulse').style.top=top+'%'}async function tick(){try{const r=await fetch(API+'?mode=read&token='+encodeURIComponent(TOKEN)+'&t='+Date.now(),{cache:'no-store'}),j=await r.json();if(!j.ok)throw 0;$('amb').textContent=j.session.ambulance_id||'AMB-0001';if(!j.location){$('status').textContent='Waiting for first GPS update';return}const l=j.location,age=Math.max(0,(Date.now()-new Date(l.recorded_at))/1000);let d=0;if(prev&&prev.recorded_at!==l.recorded_at){d=hav([prev.lat,prev.lon],[l.lat,l.lon]);markerMove(d)}const moving=(l.speed!=null&&l.speed>1.2)||d>.008;$('move').textContent=moving?`AMBULANCE MOVING • +${Math.round(d*1000)} m`:'GPS connected • waiting for movement';$('last').textContent='Updated '+new Date(l.recorded_at).toLocaleTimeString()+' • '+Math.round(age)+' sec ago';$('speed').textContent=l.speed==null?(moving?'Moving':'GPS active'):Math.round(l.speed*3.6)+' km/h';$('gps').textContent='GPS accuracy '+(l.accuracy?Math.round(l.accuracy)+' m':'—');$('status').textContent=age>30?'GPS update delayed':moving?'Ambulance is moving live':'Ambulance GPS connected';$('status').className=age>30?'bad':'green';if(j.session.destination_lat!=null&&j.session.destination_lon!=null){const km=hav([l.lat,l.lon],[j.session.destination_lat,j.session.destination_lon]),kph=l.speed&&l.speed>2?l.speed*3.6:40;$('eta').textContent=Math.max(1,Math.ceil(km/kph*60))+' min'}else $('eta').textContent=moving?'MOVING':'GPS';prev=l}catch(e){$('status').textContent='Reconnecting to ambulance…';$('status').className='bad'}}tick();setInterval(tick,3000);</script></body></html>
